spring:
  application:
    name: codebase-copilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codebase_copilot}
    username: ${DB_USERNAME:copilot}
    password: ${DB_PASSWORD:copilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Codebase Copilot
    description: AI-assisted codebase understanding API

app:
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:http://localhost:11434/v1}
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:qwen2.5-coder:1.5b}
    embedding-model: ${AI_EMBEDDING_MODEL:nomic-embed-text}
    connect-timeout: ${AI_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${AI_READ_TIMEOUT:PT45S}
  indexing:
    worker:
      enabled: ${INDEXING_WORKER_ENABLED:true}
    poll-delay-ms: ${INDEXING_POLL_DELAY_MS:2000}
    max-files: ${INDEXING_MAX_FILES:20000}
    max-total-bytes: ${INDEXING_MAX_TOTAL_BYTES:52428800}
    max-file-bytes: ${INDEXING_MAX_FILE_BYTES:1048576}
